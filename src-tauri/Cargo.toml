[package]
name = "hoi4-mod-maker-pro"
version = "0.1.0"
description = "Professional desktop application for creating Hearts of Iron IV mods"
authors = ["you"]
edition = "2021"

[lib]
name = "hoi4_mod_maker_pro_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
